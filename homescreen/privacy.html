<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacybeleid - HomeScreen for HomeKit</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #171719;
      --line: #2a2a2d;
      --text: #f6f6f7;
      --muted: #c8c8cf;
      --soft: #98989f;
      --blue: #4cc9ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      max-width: 820px;
      padding: 48px 24px 72px;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: 0;
    }

    h2 {
      font-size: 22px;
      line-height: 1.2;
      margin: 0 0 12px;
    }

    p, li {
      color: var(--muted);
      font-size: 17px;
    }

    p {
      margin: 0 0 12px;
    }

    a, button {
      color: var(--blue);
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #041014;
      background: var(--blue);
      border-color: transparent;
    }

    header {
      margin-bottom: 28px;
    }

    section {
      padding: 22px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 22px;
    }

    li + li {
      margin-top: 8px;
    }

    .muted {
      color: var(--soft);
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    @media (max-width: 720px) {
      main {
        padding: 32px 16px 56px;
      }

      section {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

      <p class="muted">HomeScreen for HomeKit</p>
      <p>Privacyinformatie wordt geladen.</p>

        <p>JavaScript is nodig om automatisch de juiste taal te tonen.</p>
      </noscript>
    </header>

    function normalizeLanguage(value) {
      const language = String(value || "").toLowerCase();
      if (language.startsWith("de")) return "de";
      if (language.startsWith("en")) return "en";
      return "nl";
    }

    function selectedLanguage() {
      const queryLanguage = new URLSearchParams(window.location.search).get("lang");
      if (queryLanguage) return normalizeLanguage(queryLanguage);

      const browserLanguages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];

      const matched = browserLanguages.find((language) => {
        const normalized = normalizeLanguage(language);
        return normalized === "de" || normalized === "en" || normalized === "nl";
      });

      return normalizeLanguage(matched);
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function paragraph(text, className = "") {
      return element("p", className, text);
    }

    function bulletList(items) {
      const list = document.createElement("ul");
      items.forEach((item) => {
        const entry = document.createElement("li");
        entry.textContent = item;
        list.append(entry);
      });
      return list;
    }

    function updateUrlLanguage(language) {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", language);
      window.history.replaceState({}, "", url);
    }

    function renderSection(data) {
      const section = element("section");
      section.append(element("h2", "", data.title));

      if (data.bullets) section.append(bulletList(data.bullets));
      if (data.paragraphs) data.paragraphs.forEach((item) => section.append(paragraph(item)));

      if (data.contact) {
        const contact = document.createElement("p");
        contact.append(document.createTextNode(data.contact));
        const mail = document.createElement("a");
        mail.href = `mailto:${supportEmail}`;
        mail.textContent = supportEmail;
        contact.append(mail, document.createTextNode("."));
        section.append(contact);
      }

      return section;
    }

    function render(language) {
      const content = copy[language] || copy.nl;
      document.documentElement.lang = language;
      document.title = content.documentTitle;

      const main = document.getElementById("privacy-content");
      main.replaceChildren();

      const header = document.createElement("header");
      header.append(element("h1", "", content.heading));
      header.append(paragraph(content.updated, "muted"));
      header.append(paragraph(content.intro));

      const switcher = element("div", "language-switcher");
      switcher.setAttribute("aria-label", content.languageLabel);
      ["nl", "en", "de"].forEach((code) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = content.languageNames[code];
        button.setAttribute("aria-pressed", code === language ? "true" : "false");
        button.addEventListener("click", () => {
          updateUrlLanguage(code);
          render(code);
        });
        switcher.append(button);
      });

      header.append(switcher);
      main.append(header);
      content.sections.forEach((section) => main.append(renderSection(section)));
    }

    render(selectedLanguage());
  </script>
</body>
</html>
