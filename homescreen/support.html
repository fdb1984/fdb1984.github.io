  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #171719;
      --line: #2a2a2d;
      --text: #f6f6f7;
      --muted: #c8c8cf;
      --soft: #8f8f98;
      --blue: #4cc9ff;
      --red: #ff6961;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      max-width: 900px;
      padding: 48px 24px 72px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: 0;
    }

    h2 {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 12px;
    }

    p, li {
      color: var(--muted);
      font-size: 17px;
    }

    p {
      margin: 0 0 12px;
    }

    a, button {
      color: var(--blue);
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #041014;
      background: var(--blue);
      border-color: transparent;
    }

    section {
      padding: 22px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 22px;
    }

    li + li {
      margin-top: 8px;
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .note {
      border-color: rgba(76, 201, 255, 0.35);
    }

    .warning {
      border-color: rgba(255, 105, 97, 0.45);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--soft);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .label::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
    }

    .warning .label::before {
      background: var(--red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 720px) {
      main {
        padding: 32px 16px 56px;
      }

      section {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

  <main id="support-content">
    <header>
      <h1>HomeScreen for HomeKit support</h1>
      <p>Supportinformatie wordt geladen.</p>
      <noscript>
        <section class="note">
          <div class="label">Nederlands</div>
          <h2>Support zonder scripts</h2>
          <p>HomeScreen for HomeKit maakt van een iPad of iPhone een rustig homescreen en bedieningsscherm voor je HomeKit-huis. De app is bedoeld voor iedereen in huis die snel wil zien wat er speelt, een lamp wil bedienen, een scene wil starten, een camera wil openen of een melding wil begrijpen zonder door de Home-app te zoeken.</p>
          <p>Op iPad werkt HomeScreen als wandpaneel. Op iPhone werkt het ook als snelle afstandsbediening voor je HomeKit-huis.</p>
          <p>Je kunt de app 30 dagen volledig proberen. Daarna ontgrendel je HomeScreen met een eenmalige aankoop via Apple. Er is geen abonnement en geen HomeScreen-account.</p>
          <p>HomeKit-data blijft in HomeKit. Appvoorkeuren kunnen via iCloud binnen je eigen Apple-account worden bewaard.</p>
          <p>Weergegevens komen van Apple Weather waar beschikbaar. Bekijk de <a href="https://weatherkit.apple.com/legal-attribution.html">Apple Weather juridische bronvermelding</a>.</p>
          <p>Support: <a href="mailto:support@debruinstudio.nl">support@debruinstudio.nl</a></p>
        </section>
        <section>
          <div class="label">English</div>
          <h2>Support without scripts</h2>
          <p>HomeScreen for HomeKit turns an iPad or iPhone into a calm home screen and control panel for your HomeKit home. It is built for everyone at home who wants to see what is happening, control a light, run a scene, open a camera, or understand an alert without digging through the Home app.</p>
          <p>On iPad, HomeScreen works as a wall panel. On iPhone, it also works as a quick remote for your HomeKit home.</p>
          <p>You can use the full app for 30 days. After that, unlock HomeScreen with a one-time purchase through Apple. There is no subscription and no HomeScreen account.</p>
          <p>HomeKit data stays in HomeKit. App preferences can be stored with iCloud inside your own Apple account.</p>
          <p>Weather data is provided by Apple Weather where available. See the <a href="https://weatherkit.apple.com/legal-attribution.html">Apple Weather legal attribution</a>.</p>
          <p>Support: <a href="mailto:support@debruinstudio.nl">support@debruinstudio.nl</a></p>
        </section>
        <section>
          <div class="label">Deutsch</div>
          <h2>Support ohne Scripts</h2>
          <p>HomeScreen for HomeKit macht aus einem iPad oder iPhone einen ruhigen Homescreen und ein Bedienfeld für dein HomeKit-Zuhause. Die App ist für alle im Haushalt gedacht, die schnell sehen möchten, was los ist, Licht steuern, eine Szene starten, eine Kamera öffnen oder einen Hinweis verstehen möchten, ohne in der Home-App zu suchen.</p>
          <p>Auf dem iPad funktioniert HomeScreen als Wandpanel. Auf dem iPhone funktioniert es auch als schnelle Fernbedienung für dein HomeKit-Zuhause.</p>
          <p>Du kannst die App 30 Tage vollständig testen. Danach schaltest du HomeScreen mit einem einmaligen Kauf über Apple frei. Es gibt kein Abonnement und kein HomeScreen-Konto.</p>
          <p>HomeKit-Daten bleiben in HomeKit. App-Einstellungen können über iCloud in deinem eigenen Apple Account gespeichert werden.</p>
          <p>Wetterdaten kommen, soweit verfügbar, von Apple Weather. Siehe die <a href="https://weatherkit.apple.com/legal-attribution.html">rechtliche Apple Weather Quellenangabe</a>.</p>
          <p>Support: <a href="mailto:support@debruinstudio.nl">support@debruinstudio.nl</a></p>
        </section>
      </noscript>
    </header>

    function normalizeLanguage(value) {
      const language = String(value || "").toLowerCase();
      if (language.startsWith("de")) return "de";
      if (language.startsWith("en")) return "en";
      return "nl";
    }

    function selectedLanguage() {
      const queryLanguage = new URLSearchParams(window.location.search).get("lang");
      if (queryLanguage) return normalizeLanguage(queryLanguage);

      const browserLanguages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];

      const matched = browserLanguages.find((language) => {
        const normalized = normalizeLanguage(language);
        return normalized === "de" || normalized === "en" || normalized === "nl";
      });

      return normalizeLanguage(matched);
    }

    function textNode(value) {
      return document.createTextNode(value);
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function paragraph(text) {
      return element("p", "", text);
    }

    function bulletList(items) {
      const list = document.createElement("ul");
      items.forEach((item) => {
        const entry = document.createElement("li");
        entry.textContent = item;
        list.append(entry);
      });
      return list;
    }

    function section(data, className = "") {
      const node = element("section", className);
      node.append(element("div", "label", data.label));
      node.append(element("h2", "", data.title));
      if (data.body) node.append(paragraph(data.body));
      if (data.paragraphs) data.paragraphs.forEach((item) => node.append(paragraph(item)));
      if (data.bullets) node.append(bulletList(data.bullets));
      return node;
    }

    function updateUrlLanguage(language) {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", language);
      window.history.replaceState({}, "", url);
    }

    function render(language) {
      const content = copy[language] || copy.nl;
      document.documentElement.lang = language;
      document.title = content.documentTitle;

      const main = document.getElementById("support-content");
      main.replaceChildren();

      const header = document.createElement("header");
      header.append(element("h1", "", content.heading));
      content.intro.slice(0, -1).forEach((item) => header.append(paragraph(item)));

      const contact = document.createElement("p");
      contact.append(textNode(content.intro[content.intro.length - 1]));
      const mail = document.createElement("a");
      mail.href = `mailto:${supportEmail}`;
      mail.textContent = supportEmail;
      contact.append(mail, textNode("."));
      header.append(contact);

      const switcher = element("div", "language-switcher");
      switcher.setAttribute("aria-label", content.languageLabel);
      ["nl", "en", "de"].forEach((code) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = content.languageNames[code];
        button.setAttribute("aria-pressed", code === language ? "true" : "false");
        button.addEventListener("click", () => {
          updateUrlLanguage(code);
          render(code);
        });
        switcher.append(button);
      });
      header.append(switcher);
      main.append(header);

      main.append(section(content.quickStart, "note"));
      main.append(section(content.bestFor, "note"));

      const grid = element("div", "grid");
      content.cards.forEach((card) => grid.append(section(card)));
      main.append(grid);

      main.append(section(content.warning, "warning"));
      main.append(section(content.camera));
      if (content.weather) main.append(section(content.weather, "note"));

      const privacy = section(content.privacy);
      const privacyText = document.createElement("p");
      privacyText.append(textNode(content.privacy.linkPrefix));
      const privacyLink = document.createElement("a");
      privacyLink.href = `privacy.html?lang=${language}`;
      privacyLink.textContent = content.privacy.linkText;
      privacyText.append(privacyLink, textNode(content.privacy.linkSuffix));
      privacy.append(privacyText);
      main.append(privacy);
    }

    render(selectedLanguage());
  </script>
