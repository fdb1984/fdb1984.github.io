  <style>
    :root {

      --line: #2a2a2d;
      --text: #f6f6f7;
      --muted: #c8c8cf;
      --soft: #8f8f98;
      --blue: #4cc9ff;
      --red: #ff6961;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      max-width: 960px;
      padding: 48px 24px 72px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: 0;
    }

    h2 {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 12px;
    }

    p,
    li {
      color: var(--muted);
      font-size: 17px;
    }

    p {
      margin: 0 0 12px;
    }

    a,
    button {
      color: var(--blue);
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #041014;
      background: var(--blue);
      border-color: transparent;
    }

    section {
      padding: 22px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 22px;
    }

    li + li {
      margin-top: 8px;
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .note {
      border-color: rgba(76, 201, 255, 0.35);
    }

    .warning {
      border-color: rgba(255, 105, 97, 0.45);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--soft);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .label::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
    }

    .warning .label::before {
      background: var(--red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 720px) {
      main {
        padding: 32px 16px 56px;
      }

      section {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

  <main id="support-content">
    <header>
      <h1>HomeScreen for HomeKit support</h1>
      <p>Supportinformatie wordt geladen.</p>
      <noscript>
        <section class="note">
          <div class="label">Nederlands</div>
          <h2>Support zonder scripts</h2>
          <p>HomeScreen geeft je HomeKit-woning een vast dashboard op iPad en een compacte bediening op iPhone.</p>
          <p>Versie 1.11 voegt meer zichtbaarheidskeuzes, betere ondersteuning voor deuren, ramen en garages, een instelbare deurbelcamera en duidelijkere instellingen toe. Versie 1.11.1 verbetert de herkenning van wand- en radiatorthermostaten.</p>
          <p>Je kunt de app 30 dagen volledig proberen. Daarna ontgrendel je HomeScreen met een eenmalige aankoop via Apple. Er is geen abonnement.</p>
          <p>HomeKit-data blijft in HomeKit. Borden en gedeelde appinstellingen kunnen via iCloud worden bewaard; favorieten, schermgedrag en deurbelgedrag blijven per apparaat ingesteld.</p>
          <p>Weergegevens komen van Apple Weather waar beschikbaar. Bekijk de <a href="https://weatherkit.apple.com/legal-attribution.html">Apple Weather juridische bronvermelding</a>.</p>
          <p>Support: <a href="mailto:support@debruinstudio.nl">support@debruinstudio.nl</a></p>
        </section>
        <section>
          <div class="label">English</div>
          <h2>Support without scripts</h2>
          <p>HomeScreen gives your HomeKit home a fixed dashboard on iPad and compact controls on iPhone.</p>
          <p>Version 1.11 adds more visibility controls, better door, window, and garage support, a per-device doorbell option, and clearer Settings. Version 1.11.1 improves wall and radiator thermostat detection.</p>
          <p>You can use the full app for 30 days. After that, unlock HomeScreen with a one-time purchase through Apple. There is no subscription.</p>
          <p>HomeKit data stays in HomeKit. Boards and shared app settings can be stored in iCloud; favorites, idle-screen behavior, and doorbell behavior remain set per device.</p>
          <p>Weather data is provided by Apple Weather where available. See the <a href="https://weatherkit.apple.com/legal-attribution.html">Apple Weather legal attribution</a>.</p>
          <p>Support: <a href="mailto:support@debruinstudio.nl">support@debruinstudio.nl</a></p>
        </section>
        <section>
          <div class="label">Deutsch</div>
          <h2>Support ohne Scripts</h2>
          <p>HomeScreen zeigt dein HomeKit-Zuhause als festes Dashboard auf dem iPad und als kompakte Bedienung auf dem iPhone.</p>
          <p>Version 1.11 ergänzt weitere Sichtbarkeitseinstellungen, bessere Unterstützung für Türen, Fenster und Garagentore, eine Türklingeloption pro Gerät und übersichtlichere Einstellungen. Version 1.11.1 verbessert die Erkennung von Wand- und Heizkörperthermostaten.</p>
          <p>Du kannst die App 30 Tage vollständig testen. Danach schaltest du HomeScreen mit einem einmaligen Kauf über Apple frei. Es gibt kein Abonnement.</p>
          <p>HomeKit-Daten bleiben in HomeKit. Boards und gemeinsame App-Einstellungen können in iCloud gespeichert werden; Favoriten, Ruhebildschirm und Türklingelverhalten bleiben pro Gerät eingestellt.</p>
          <p>Wetterdaten kommen, soweit verfügbar, von Apple Weather. Siehe die <a href="https://weatherkit.apple.com/legal-attribution.html">rechtliche Apple Weather Quellenangabe</a>.</p>
          <p>Support: <a href="mailto:support@debruinstudio.nl">support@debruinstudio.nl</a></p>
        </section>
      </noscript>
    </header>
  </main>

    function normalizeLanguage(value) {
      const language = String(value || "").toLowerCase();
      if (language.startsWith("de")) return "de";
      if (language.startsWith("en")) return "en";
      return "nl";
    }

    function selectedLanguage() {
      const queryLanguage = new URLSearchParams(window.location.search).get("lang");
      if (queryLanguage) return normalizeLanguage(queryLanguage);

      const browserLanguages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];

      const matched = browserLanguages.find((language) => {
        const normalized = normalizeLanguage(language);
        return normalized === "de" || normalized === "en" || normalized === "nl";
      });

      return normalizeLanguage(matched);
    }

    function textNode(value) {
      return document.createTextNode(value);
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function paragraph(text) {
      return element("p", "", text);
    }

    function bulletList(items) {
      const list = document.createElement("ul");
      items.forEach((item) => {
        const entry = document.createElement("li");
        entry.textContent = item;
        list.append(entry);
      });
      return list;
    }

    function section(data, className = "") {
      const node = element("section", className);
      node.append(element("div", "label", data.label));
      node.append(element("h2", "", data.title));
      if (data.body) node.append(paragraph(data.body));
      if (data.paragraphs) data.paragraphs.forEach((item) => node.append(paragraph(item)));
      if (data.bullets) node.append(bulletList(data.bullets));
      return node;
    }

    function updateUrlLanguage(language) {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", language);
      window.history.replaceState({}, "", url);
    }

    function render(language) {
      const content = copy[language] || copy.nl;
      document.documentElement.lang = language;
      document.title = content.documentTitle;

      const main = document.getElementById("support-content");
      main.replaceChildren();

      const header = document.createElement("header");
      header.append(element("h1", "", content.heading));
      content.intro.slice(0, -1).forEach((item) => header.append(paragraph(item)));

      const contact = document.createElement("p");
      contact.append(textNode(content.intro[content.intro.length - 1]));
      const mail = document.createElement("a");
      mail.href = "mailto:" + supportEmail;
      mail.textContent = supportEmail;
      contact.append(mail, textNode("."));
      header.append(contact);

      const switcher = element("div", "language-switcher");
      switcher.setAttribute("aria-label", content.languageLabel);
      ["nl", "en", "de"].forEach((code) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = content.languageNames[code];
        button.setAttribute("aria-pressed", code === language ? "true" : "false");
        button.addEventListener("click", () => {
          updateUrlLanguage(code);
          render(code);
        });
        switcher.append(button);
      });
      header.append(switcher);
      main.append(header);

      main.append(section(content.quickStart, "note"));
      main.append(section(content.release, "note"));
      main.append(section(content.bestFor, "note"));

      const grid = element("div", "grid");
      content.cards.forEach((card) => grid.append(section(card)));
      main.append(grid);

      main.append(section(content.warning, "warning"));
      main.append(section(content.camera));
      main.append(section(content.weather, "note"));

      const privacy = section(content.privacy);
      const privacyText = document.createElement("p");
      privacyText.append(textNode(content.privacy.linkPrefix));
      const privacyLink = document.createElement("a");
      privacyLink.href = "privacy.html?lang=" + language;
      privacyLink.textContent = content.privacy.linkText;
      privacyText.append(privacyLink, textNode(content.privacy.linkSuffix));
      privacy.append(privacyText);
      main.append(privacy);
    }

    render(selectedLanguage());
  </script>
</body>
</html>
